version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      dev-dependencies:
        dependency-type: development
    ignore:
      # typescript-eslint pins TypeScript below 6.1; bump together by hand
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      # @types/node follows the Node runtime major (see .nvmrc and Dockerfile)
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Node runtime majors are moved by hand, in step with .nvmrc
      - dependency-name: node
        update-types: [version-update:semver-major]
